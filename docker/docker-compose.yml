version: "3.8"

# Stack VPS : Nextcloud (stockage + app mobile) + Caddy (reverse proxy HTTPS auto)
# pour cloud.anzee.xyz, et le site custom (Next.js) pour anzee.xyz.
#
# Avant le premier lancement : copier .env.example en .env et remplir les valeurs.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    networks:
      - internal

  nextcloud:
    image: nextcloud:29-apache
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.anzee.xyz
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://cloud.anzee.xyz
      TRUSTED_PROXIES: caddy
    networks:
      - internal

  site:
    build: ../site
    restart: unless-stopped
    env_file:
      - ../site/.env
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nextcloud
      - site
    networks:
      - internal

networks:
  internal:

volumes:
  db_data:
  nextcloud_data:
  caddy_data:
  caddy_config:
